name: Build Android APK

on:
  push:
    tags: ["v*"]            # git tag v1.0.0 && git push origin v1.0.0 — соберёт APK и создаст Release
  workflow_dispatch:         # ручной запуск: Actions -> Build Android APK -> Run workflow
    inputs:
      publish_release:
        description: "Прикрепить APK к GitHub Release (нужен существующий тег, выбранный в Use workflow from)"
        type: boolean
        default: false

permissions:
  contents: write            # нужно, чтобы прикрепить файлы к Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Подпись релиза. Если секреты не заданы — APK подпишется отладочным ключом (установится, но обновление поверх
      # APK, собранного другим ключом, Android не разрешит). Как создать ключ — в README, раздел «Подпись».
      - name: Ключ подписи (если задан)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zephyrus.jks"
            echo "ZEPHYRUS_KEYSTORE=$RUNNER_TEMP/zephyrus.jks" >> "$GITHUB_ENV"
            echo "Ключ подписи найден"
          else
            echo "Ключ подписи не задан — будет использован отладочный"
          fi

      - name: Сборка release APK
        env:
          ZEPHYRUS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ZEPHYRUS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ZEPHYRUS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Имена файлов и контрольные суммы
        run: |
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            base="$(basename "$f" .apk)"        # app-arm64-v8a-release, app-universal-release ...
            abi="${base#app-}"; abi="${abi%-release}"
            cp "$f" "out/Zephyrus-${VERSION}-${abi}.apk"
          done
          (cd out && sha256sum *.apk > SHA256SUMS-android.txt)
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: Zephyrus-Android
          path: out/*

      - name: Публикация релиза
        if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
